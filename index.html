    background: linear-gradient(135deg, var(--blue), var(--deep));
    box-shadow: 0 6px 18px rgba(5, 106, 226, .30);
  }
  .btn:active { opacity: .85; }
  .btn.ghost {
    background: #fff; color: var(--blue);
    border: 1.5px solid #c7d9f2; box-shadow: none; margin-top: 12px;
  }
  .meta { margin-top: 22px; font-size: 12px; color: var(--sub); line-height: 1.8; }
